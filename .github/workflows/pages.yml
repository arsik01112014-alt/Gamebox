# Публикует веб-версию GameBox (assets) на GitHub Pages.
# Нужно один раз: Settings → Pages → Source: GitHub Actions.
name: GameBox site

on:
  push:
    branches: [main]
    paths: ['assets/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gamebox-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: assets
      - id: deploy
        uses: actions/deploy-pages@v4
